<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7edf2">
  <title>Stillword · Shared journal</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e7edf2;
      --surface: #fbfcfd;
      --ink: #26333f;
      --muted: #6d7b88;
      --line: #d4dee6;
      --clay: #ad705f;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background-color: var(--paper);
      background-image: radial-gradient(#cbd6df 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }
    main {
      width: min(100%, 760px);
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 18px 55px rgb(38 51 63 / 10%);
    }
    .eyebrow { margin-bottom: 12px; color: var(--clay); font: 700 11px Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(27px, 6vw, 38px); font-weight: 500; overflow-wrap: anywhere; }
    .status, .date { color: var(--muted); font: 13px/1.7 Arial, sans-serif; }
    .entries { display: grid; gap: 24px; margin-top: 25px; }
    .entry { padding-top: 20px; border-top: 1px solid var(--line); }
    .entry h2 { margin: 0 0 8px; font-size: 23px; font-weight: 500; overflow-wrap: anywhere; }
    .date { margin: 0; }
    .body { margin: 14px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.9 Georgia, "Times New Roman", serif; }
    .error { color: #a0443c; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A journal, shared with you</p>
    <h1>Words meant for you</h1>
    <p class="status" id="status" role="status">Opening shared entries…</p>
    <section class="entries" id="entries" aria-live="polite"></section>
  </main>
  <script>
    (() => {
      const status = document.querySelector("#status");
      const entries = document.querySelector("#entries");

      async function openSharedEntries() {
        const payload = new URLSearchParams(location.hash.slice(1)).get("data");
        if (!payload) throw new Error("This link does not contain shared entries.");
        if (!("DecompressionStream" in window)) throw new Error("Please open this link in a recent browser.");
        const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");
        const binary = atob(base64.padEnd(Math.ceil(base64.length / 4) * 4, "="));
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const sharedNotes = JSON.parse(await new Response(stream).text());
        if (!Array.isArray(sharedNotes) || sharedNotes.length === 0) throw new Error("This link contains no entries.");
        sharedNotes.sort((left, right) => right.date.localeCompare(left.date) || right.updatedAt.localeCompare(left.updatedAt));

        for (const note of sharedNotes) {
          const article = document.createElement("article");
          article.className = "entry";
          const title = document.createElement("h2");
          title.textContent = note.title || "Untitled";
          const [year, month, day] = note.date.split("-").map(Number);
          const date = document.createElement("p");
          date.className = "date";
          date.textContent = new Intl.DateTimeFormat("en-US", { year: "numeric", month: "long", day: "numeric" }).format(new Date(year, month - 1, day));
          const body = document.createElement("p");
          body.className = "body";
          body.textContent = note.body;
          article.append(title, date, body);
          entries.append(article);
        }
        status.remove();
      }

      openSharedEntries().catch((error) => {
        status.classList.add("error");
        status.textContent = error.message || "Could not open this shared journal.";
      });
    })();
  </script>
</body>
</html>
